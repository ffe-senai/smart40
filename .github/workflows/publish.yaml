name: publish

# Publishes the package to npm on every version tag (v0.1.0, v0.2.0-beta.1, ...).
# The tag must match the "version" in package.json; pre-release versions go to the "next" dist-tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Tag must match package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --provenance --tag next ;;
            *)   npm publish --provenance ;;
          esac
