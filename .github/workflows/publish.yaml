name: publish

# Publishes the package to npm on every version tag (v0.1.0, v0.2.0-beta.1, ...) through npm trusted
# publishing (GitHub OIDC, no token). The tag must match the "version" in package.json; pre-release
# versions go to the "next" dist-tag. A version that is already on npm is skipped.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Tag must match package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, skipping"
            exit 0
          fi
          case "$version" in
            *-*) npm publish --tag next ;;
            *)   npm publish ;;
          esac
